# ===== Server =====
server.port=8080

# ===== MySQL / JPA =====
spring.datasource.url=jdbc:mysql://localhost:3306/pet_adoption_portal?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Monika$@2004moni
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automatically creates/updates tables from the @Entity classes on startup.
# (database/schema.sql is also provided if you prefer to create tables manually.)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== Jackson JSON =====
# Converts Java camelCase fields (petName) to snake_case JSON keys (pet_name)
# so the existing frontend JavaScript works without any changes.
spring.jackson.property-naming-strategy=SNAKE_CASE

# ===== File upload (pet photos) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=uploads

# ===== Session =====
server.servlet.session.timeout=60m
