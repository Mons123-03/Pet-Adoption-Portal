<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Pet Adoption Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg" id="navbar"></nav>

<div class="container my-5">
    <h3 class="section-title">Admin Control Center</h3>
    <p class="section-sub mb-4">Full visibility into users, pet listings, and adoption requests across the platform.</p>

    <!-- Top-level summary stats -->
    <div class="row g-3 mb-3" id="statsGridTop"></div>
    <div class="row g-3 mb-4" id="statsGridBottom"></div>

    <ul class="nav nav-tabs mb-4 flex-nowrap overflow-auto">
        <li class="nav-item"><a class="nav-link active" href="#" onclick="switchTab('users');return false;" id="tab-users">Users</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('pets');return false;" id="tab-pets">Pet Listings</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('requests');return false;" id="tab-requests">Adoption Requests</a></li>
    </ul>

    <div id="alertBox"></div>

    <div class="table-responsive table-wrap" id="usersTab">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Joined</th><th>Action</th></tr></thead>
            <tbody id="usersBody"></tbody>
        </table>
    </div>

    <div class="table-responsive table-wrap" id="petsTab" style="display:none;">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>Pet</th><th>Category</th><th>Owner</th><th>Status</th><th>Listed</th><th>Action</th></tr></thead>
            <tbody id="petsBody"></tbody>
        </table>
    </div>

    <div class="table-responsive table-wrap" id="requestsTab" style="display:none;">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>Pet</th><th>Adopter</th><th>Status</th><th>Requested</th><th>Action</th></tr></thead>
            <tbody id="requestsBody"></tbody>
        </table>
    </div>
</div>

<footer>Pet Adoption Portal &middot; Admin Module</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script>
(async function init() {
    const user = await loadNavbar('admin');
    if (!user || user.role !== 'ADMIN') { window.location.href = 'login.html'; return; }
    loadStats();
    loadUsers();
})();

function switchTab(tab) {
    ['users', 'pets', 'requests'].forEach(function(t) {
        document.getElementById('tab-' + t).classList.toggle('active', t === tab);
        document.getElementById(t + 'Tab').style.display = (t === tab) ? 'block' : 'none';
    });
    if (tab === 'pets') loadPets();
    if (tab === 'requests') loadRequests();
}

function statCard(icon, num, label) {
    return '<div class="col-6 col-md-3 col-lg"><div class="stat-card"><div class="icon">' + icon + '</div>' +
        '<div><div class="num">' + num + '</div><div class="label">' + label + '</div></div></div></div>';
}

async function loadStats() {
    try {
        const data = await apiGet('/api/admin/reports');
        const u = data.userStats, p = data.petStats, r = data.requestStats;

        document.getElementById('statsGridTop').innerHTML =
            statCard(ICONS.users, u.total_users, 'Total Users') +
            statCard(ICONS.users, u.total_adopters, 'Adopters') +
            statCard(ICONS.users, u.total_owners, 'Pet Owners') +
            statCard(ICONS.paw, p.total_pets, 'Total Pets') +
            statCard(ICONS.home, p.available_pets, 'Available');

        document.getElementById('statsGridBottom').innerHTML =
            statCard(ICONS.clock, p.pending_pets, 'Pets Pending') +
            statCard(ICONS.check, p.adopted_pets, 'Pets Adopted') +
            statCard(ICONS.paw, r.total_requests, 'Total Requests') +
            statCard(ICONS.clock, r.pending_requests, 'Requests Pending') +
            statCard(ICONS.check, r.approved_requests, 'Requests Approved');
    } catch (err) {
        showAlert(document.getElementById('alertBox'), err.message);
    }
}

async function loadUsers() {
    const tbody = document.getElementById('usersBody');
    try {
        const data = await apiGet('/api/admin/users');
        if (data.users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No users found.</td></tr>';
            return;
        }
        tbody.innerHTML = data.users.map(function(u) {
            return '<tr>' +
                '<td>' + escapeHtml(u.full_name) + '</td>' +
                '<td>' + escapeHtml(u.email) + '</td>' +
                '<td>' + escapeHtml(u.phone || '—') + '</td>' +
                '<td><span class="badge bg-secondary">' + u.role + '</span></td>' +
                '<td>' + new Date(u.created_at).toLocaleDateString() + '</td>' +
                '<td>' + (u.role !== 'ADMIN' ? '<button class="btn btn-sm btn-outline-danger" onclick="deleteUser(' + u.user_id + ')">Remove</button>' : '—') + '</td>' +
            '</tr>';
        }).join('');
    } catch (err) {
        showAlert(document.getElementById('alertBox'), err.message);
    }
}

async function deleteUser(id) {
    if (!confirm('Remove this user? Their pets and requests will also be removed.')) return;
    try {
        await apiPostForm('/api/admin/users', { user_id: id });
        loadUsers();
        loadStats();
    } catch (err) {
        showAlert(document.getElementById('alertBox'), err.message);
    }
}

async function loadPets() {
    const tbody = document.getElementById('petsBody');
    try {
        const data = await apiGet('/api/admin/pets');
        if (data.pets.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No pet listings found.</td></tr>';
            return;
        }
        tbody.innerHTML = data.pets.map(function(p) {
            return '<tr>' +
                '<td>' + escapeHtml(p.pet_name) + '</td>' +
                '<td>' + escapeHtml(p.category) + '</td>' +
                '<td>' + escapeHtml(p.owner_name) + '</td>' +
                '<td><span class="badge badge-' + p.status + '">' + p.status + '</span></td>' +
                '<td>' + new Date(p.created_at).toLocaleDateString() + '</td>' +
                '<td><button class="btn btn-sm btn-outline-danger" onclick="deletePet(' + p.pet_id + ')">Remove</button></td>' +
            '</tr>';
        }).join('');
    } catch (err) {
        showAlert(document.getElementById('alertBox'), err.message);
    }
}

async function deletePet(id) {
    if (!confirm('Remove this pet listing?')) return;
    try {
        await apiPostForm('/api/admin/pets', { pet_id: id });
        loadPets();
        loadStats();
    } catch (err) {
        showAlert(document.getElementById('alertBox'), err.message);
    }
}

async function loadRequests() {
    const tbody = document.getElementById('requestsBody');
    try {
        const data = await apiGet('/api/admin/requests');
        if (data.requests.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No adoption requests found.</td></tr>';
            return;
        }
        tbody.innerHTML = data.requests.map(function(r) {
            return '<tr>' +
                '<td>' + escapeHtml(r.pet_name) + '</td>' +
                '<td>' + escapeHtml(r.adopter_name) + '</td>' +
                '<td><span class="badge badge-' + r.status + '">' + r.status + '</span></td>' +
                '<td>' + new Date(r.requested_at).toLocaleDateString() + '</td>' +
                '<td>' + (r.status === 'PENDING'
                    ? '<button class="btn btn-sm btn-success" onclick="updateRequest(' + r.request_id + ', \'APPROVED\')">Approve</button> ' +
                      '<button class="btn btn-sm btn-outline-danger" onclick="updateRequest(' + r.request_id + ', \'REJECTED\')">Reject</button>'
                    : '—') +
            '</tr>';
        }).join('');
    } catch (err) {
        showAlert(document.getElementById('alertBox'), err.message);
    }
}

async function updateRequest(id, status) {
    try {
        await apiPostForm('/api/admin/requests', { request_id: id, status: status });
        loadRequests();
        loadStats();
    } catch (err) {
        showAlert(document.getElementById('alertBox'), err.message);
    }
}
</script>
</body>
</html>
