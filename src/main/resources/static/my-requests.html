<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Requests - Pet Adoption Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg" id="navbar"></nav>

<div class="container my-5">
    <h3 class="section-title">My Adoption Requests</h3>
    <p class="section-sub mb-4">Track the status of every request you've submitted.</p>

    <div class="row g-3 mb-4" id="statsRow"></div>

    <div id="alertBox"></div>
    <div class="row g-4" id="reqGrid"></div>
</div>

<footer>Pet Adoption Portal &middot; Java Servlets + JDBC + MySQL</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script>
(async function init() {
    const user = await loadNavbar('requests');
    if (!user || user.role !== 'ADOPTER') { window.location.href = 'login.html'; return; }
    loadRequests();
})();

function statCard(icon, num, label) {
    return '<div class="col-6 col-md-3"><div class="stat-card"><div class="icon">' + icon + '</div>' +
        '<div><div class="num">' + num + '</div><div class="label">' + label + '</div></div></div></div>';
}

async function loadRequests() {
    const grid = document.getElementById('reqGrid');
    try {
        const data = await apiGet('/api/my-requests');
        const requests = data.requests;

        const pending = requests.filter(r => r.status === 'PENDING').length;
        const approved = requests.filter(r => r.status === 'APPROVED').length;
        const rejected = requests.filter(r => r.status === 'REJECTED').length;
        document.getElementById('statsRow').innerHTML =
            statCard(ICONS.paw, requests.length, 'Total Requests') +
            statCard(ICONS.clock, pending, 'Pending') +
            statCard(ICONS.check, approved, 'Approved') +
            statCard(ICONS.users, rejected, 'Rejected');

        if (requests.length === 0) {
            grid.innerHTML = emptyState('You have not submitted any adoption requests yet.');
            return;
        }
        grid.innerHTML = requests.map(function(r) {
            return '' +
            '<div class="col-sm-6 col-lg-4">' +
              '<div class="card pet-card position-relative">' +
                statusBadge(r.status) +
                petPhotoOrPlaceholder(r.image_url) +
                '<div class="card-body">' +
                  '<h5 class="card-title">' + escapeHtml(r.pet_name) + '</h5>' +
                  '<p class="text-muted mb-1">' + escapeHtml(r.category) + '</p>' +
                  '<p class="card-text">' + (r.message ? 'Your message: "' + escapeHtml(r.message) + '"' : 'No message included.') + '</p>' +
                  '<p class="text-muted small mb-0">Requested ' + new Date(r.requested_at).toLocaleDateString() + '</p>' +
                '</div>' +
              '</div>' +
            '</div>';
        }).join('');
    } catch (err) {
        showAlert(document.getElementById('alertBox'), err.message);
    }
}
</script>
</body>
</html>
