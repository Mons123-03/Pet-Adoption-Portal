<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Pet Adoption Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg" id="navbar"></nav>

<div class="form-card">
    <div class="text-center mb-3" id="formIcon"></div>
    <h3 class="mb-1 text-center">Create your account</h3>
    <p class="text-muted mb-4 text-center">Adopters browse and request pets. Owners list pets for adoption.</p>
    <div id="alertBox"></div>
    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" class="form-control" id="full_name" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="tel" class="form-control" id="phone">
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password"
                   class="form-control"
                   id="password"
                   required
                   minlength="8">
        </div>
        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password"
                   class="form-control"
                   id="confirmPassword"
                   required>
        </div>
        <div class="mb-3">
            <label class="form-label">I want to...</label>
            <select id="role" class="form-select">
                <option value="ADOPTER">Adopt a pet</option>
                <option value="OWNER">List a pet for adoption</option>
            </select>
        </div>
        <button type="submit" class="btn btn-amber w-100">Sign Up</button>
    </form>
    <p class="text-center mt-3 mb-0">Already have an account? <a href="login.html">Log in</a></p>
</div>

<footer>Pet Adoption Portal &middot; Java Servlets + JDBC + MySQL</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script>
document.getElementById('formIcon').innerHTML = ICONS.pawLogo;
loadNavbar();

document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const fullName = document.getElementById('full_name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const role = document.getElementById('role').value;

// Full Name Validation
    if(fullName === ""){
        showAlert(document.getElementById('alertBox'),
            "Full name is required");
        return;
    }

    if(!/^[A-Za-z ]+$/.test(fullName)){
        showAlert(document.getElementById('alertBox'),
            "Full name should contain only letters");
        return;
    }

// Email Validation
    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(!emailPattern.test(email)){
        showAlert(document.getElementById('alertBox'),
            "Enter a valid email address");
        return;
    }

// Phone Validation
    if(!/^[0-9]{10}$/.test(phone)){
        showAlert(document.getElementById('alertBox'),
            "Phone number must contain exactly 10 digits");
        return;
    }

// Password Validation
    if(password.length < 8){
        showAlert(document.getElementById('alertBox'),
            "Password must be at least 8 characters");
        return;
    }
    const body = {
        full_name: fullName,
        email: email,
        phone: phone,
        password: password,
        role: role
    };
    try {
        await apiPostForm('/api/register', body);
        showAlert(document.getElementById('alertBox'), 'Account created! Redirecting to login...', 'success');
        setTimeout(function() { window.location.href = 'login.html'; }, 1200);
    } catch (err) {
        showAlert(document.getElementById('alertBox'), err.message);
    }
});
</script>
</body>
</html>
