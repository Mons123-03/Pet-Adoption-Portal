<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In - Pet Adoption Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg" id="navbar"></nav>

<div class="form-card">
    <div class="text-center mb-3" id="formIcon"></div>
    <h3 class="mb-1 text-center">Welcome back</h3>
    <p class="text-muted mb-4 text-center">Log in to browse pets, manage listings, or review requests.</p>
    <div id="alertBox"></div>
    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-amber w-100">Log In</button>
    </form>
    <p class="text-center mt-3 mb-0">Don't have an account? <a href="register.html">Sign up</a></p>
    <p class="text-center text-muted small mt-2">Admin demo login: admin@petadoption.com / admin123</p>
</div>

<footer>Pet Adoption Portal &middot; Java Servlets + JDBC + MySQL</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script>
document.getElementById('formIcon').innerHTML = ICONS.pawLogo;
loadNavbar();

document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

// Email Required
    if (email === "") {
        showAlert(document.getElementById('alertBox'),
            "Email is required");
        return;
    }

// Email Format
    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {
        showAlert(document.getElementById('alertBox'),
            "Enter a valid email address");
        return;
    }

// Password Required
    if (password === "") {
        showAlert(document.getElementById('alertBox'),
            "Password is required");
        return;
    }

// Password Length
    if (password.length < 8) {
        showAlert(document.getElementById('alertBox'),
            "Password must be at least 8 characters");
        return;
    }

    try {
        const data = await apiPostForm('/api/login', { email: email, password: password });
        const role = data.user.role;
        if (role === 'ADMIN') window.location.href = 'admin-dashboard.html';
        else if (role === 'OWNER') window.location.href = 'owner-dashboard.html';
        else window.location.href = 'index.html';
    } catch (err) {
        showAlert(document.getElementById('alertBox'), err.message);
    }
});
</script>
</body>
</html>
