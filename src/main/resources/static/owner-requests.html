<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requests Received - Pet Adoption Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg" id="navbar"></nav>

<div class="container my-5">
    <h3 class="section-title">Adoption Requests Received</h3>
    <p class="section-sub mb-4">Review adopters interested in your pets and approve or reject their requests.</p>

    <div class="row g-3 mb-4" id="statsRow"></div>

    <div id="alertBox"></div>
    <div class="table-responsive table-wrap">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr><th>Pet</th><th>Adopter</th><th>Contact</th><th>Message</th><th>Status</th><th>Action</th></tr>
            </thead>
            <tbody id="reqBody"></tbody>
        </table>
    </div>
</div>

<footer>Pet Adoption Portal &middot; Pet Owner Module</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script>
(async function init() {
    const user = await loadNavbar('owner-requests');
    if (!user || user.role !== 'OWNER') { window.location.href = 'login.html'; return; }
    loadRequests();
})();

function statCard(icon, num, label) {
    return '<div class="col-6 col-md-3"><div class="stat-card"><div class="icon">' + icon + '</div>' +
        '<div><div class="num">' + num + '</div><div class="label">' + label + '</div></div></div></div>';
}

async function loadRequests() {
    const tbody = document.getElementById('reqBody');
    try {
        const data = await apiGet('/api/received-requests');
        const requests = data.requests;

        const pending = requests.filter(r => r.status === 'PENDING').length;
        const approved = requests.filter(r => r.status === 'APPROVED').length;
        const rejected = requests.filter(r => r.status === 'REJECTED').length;
        document.getElementById('statsRow').innerHTML =
            statCard(ICONS.paw, requests.length, 'Total Received') +
            statCard(ICONS.clock, pending, 'Pending') +
            statCard(ICONS.check, approved, 'Approved') +
            statCard(ICONS.users, rejected, 'Rejected');

        if (requests.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No adoption requests yet.</td></tr>';
            return;
        }
        tbody.innerHTML = requests.map(function(r) {
            return '<tr>' +
                '<td>' + escapeHtml(r.pet_name) + '</td>' +
                '<td>' + escapeHtml(r.adopter_name) + '</td>' +
                '<td>' + escapeHtml(r.adopter_email) + '<br><span class="text-muted small">' + escapeHtml(r.adopter_phone) + '</span></td>' +
                '<td>' + escapeHtml(r.message || '—') + '</td>' +
                '<td><span class="badge badge-' + r.status + '">' + r.status + '</span></td>' +
                '<td>' + (r.status === 'PENDING'
                    ? '<button class="btn btn-sm btn-success" onclick="updateStatus(' + r.request_id + ', \'APPROVED\')">Approve</button> ' +
                      '<button class="btn btn-sm btn-outline-danger" onclick="updateStatus(' + r.request_id + ', \'REJECTED\')">Reject</button>'
                    : '—') +
                '</td>' +
            '</tr>';
        }).join('');
    } catch (err) {
        showAlert(document.getElementById('alertBox'), err.message);
    }
}

async function updateStatus(id, status) {
    try {
        await apiPostForm('/api/request-update', { request_id: id, status: status });
        loadRequests();
    } catch (err) {
        showAlert(document.getElementById('alertBox'), err.message);
    }
}
</script>
</body>
</html>
