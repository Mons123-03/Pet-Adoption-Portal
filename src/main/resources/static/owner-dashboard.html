<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Listings - Pet Adoption Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg" id="navbar"></nav>

<div class="container my-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <div>
            <h3 class="section-title mb-0">My Pet Listings</h3>
            <p class="section-sub mb-0">Add, edit, or remove the pets you've listed for adoption.</p>
        </div>
        <button class="btn btn-amber" onclick="openForm()">+ Add New Pet</button>
    </div>

    <div class="row g-3 mb-4" id="statsRow"></div>

    <div id="alertBox"></div>

    <div class="card mb-4" id="petForm" style="display:none; max-width:600px;">
        <div class="card-body">
            <h5 id="formTitle">Add a Pet</h5>
            <form id="petFormEl" enctype="multipart/form-data">
                <input type="hidden" id="pet_id">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Pet name</label>
                        <input type="text" class="form-control" id="pet_name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Category</label>
                        <select class="form-select" id="category" required>
                            <option value="Dog">Dog</option>
                            <option value="Cat">Cat</option>
                            <option value="Bird">Bird</option>
                            <option value="Rabbit">Rabbit</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Breed</label>
                        <input type="text" class="form-control" id="breed">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Age (years)</label>
                        <input type="number" class="form-control" id="age" min="0">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Gender</label>
                        <select class="form-select" id="gender">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="description" rows="3"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Photo</label>
                        <input type="file" class="form-control" id="image" accept="image/*">
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-amber">Save Pet</button>
                    <button type="button" class="btn btn-outline-secondary" onclick="closeForm()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div class="row g-4" id="petGrid"></div>
</div>

<footer>Pet Adoption Portal &middot; Pet Owner Module</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script>
(async function init() {
    const user = await loadNavbar('owner');
    if (!user || user.role !== 'OWNER') { window.location.href = 'login.html'; return; }
    loadMyPets();
})();

function statCard(icon, num, label) {
    return '<div class="col-6 col-md-3"><div class="stat-card"><div class="icon">' + icon + '</div>' +
        '<div><div class="num">' + num + '</div><div class="label">' + label + '</div></div></div></div>';
}

function openForm(pet) {
    document.getElementById('petForm').style.display = 'block';
    document.getElementById('formTitle').textContent = pet ? 'Edit Pet' : 'Add a Pet';
    document.getElementById('pet_id').value = pet ? pet.pet_id : '';
    document.getElementById('pet_name').value = pet ? pet.pet_name : '';
    document.getElementById('category').value = pet ? pet.category : 'Dog';
    document.getElementById('breed').value = pet ? (pet.breed || '') : '';
    document.getElementById('age').value = pet ? (pet.age || '') : '';
    document.getElementById('gender').value = pet ? pet.gender : 'Male';
    document.getElementById('description').value = pet ? (pet.description || '') : '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
function closeForm() {
    document.getElementById('petForm').style.display = 'none';
    document.getElementById('petFormEl').reset();
}

document.getElementById('petFormEl').addEventListener('submit', async function(e) {
    e.preventDefault();
    const petId = document.getElementById('pet_id').value;
    const formData = new FormData();
    if (petId) formData.append('pet_id', petId);
    formData.append('pet_name', document.getElementById('pet_name').value);
    formData.append('category', document.getElementById('category').value);
    formData.append('breed', document.getElementById('breed').value);
    formData.append('age', document.getElementById('age').value);
    formData.append('gender', document.getElementById('gender').value);
    formData.append('description', document.getElementById('description').value);
    const imageFile = document.getElementById('image').files[0];
    if (imageFile) formData.append('image', imageFile);

    try {
        if (petId) {
            await apiPostMultipart('/api/pet-edit', formData);
            showAlert(document.getElementById('alertBox'), 'Pet updated successfully.', 'success');
        } else {
            await apiPostMultipart('/api/pet-add', formData);
            showAlert(document.getElementById('alertBox'), 'Pet listed successfully.', 'success');
        }
        closeForm();
        loadMyPets();
    } catch (err) {
        showAlert(document.getElementById('alertBox'), err.message);
    }
});

let myPetsCache = [];

async function loadMyPets() {
    const grid = document.getElementById('petGrid');
    try {
        const data = await apiGet('/api/my-pets');
        myPetsCache = data.pets;

        const available = myPetsCache.filter(p => p.status === 'AVAILABLE').length;
        const pending = myPetsCache.filter(p => p.status === 'PENDING').length;
        const adopted = myPetsCache.filter(p => p.status === 'ADOPTED').length;
        document.getElementById('statsRow').innerHTML =
            statCard(ICONS.paw, myPetsCache.length, 'Total Listed') +
            statCard(ICONS.home, available, 'Available') +
            statCard(ICONS.clock, pending, 'Pending') +
            statCard(ICONS.check, adopted, 'Adopted');

        if (myPetsCache.length === 0) {
            grid.innerHTML = emptyState('You have not listed any pets yet. Click "Add New Pet" to get started.');
            return;
        }
        grid.innerHTML = myPetsCache.map(function(pet, index) {
            return '' +
            '<div class="col-sm-6 col-lg-4">' +
              '<div class="card pet-card position-relative">' +
                statusBadge(pet.status) +
                petPhotoOrPlaceholder(pet.image_url) +
                '<div class="card-body">' +
                  '<h5 class="card-title">' + escapeHtml(pet.pet_name) + '</h5>' +
                  '<p class="text-muted mb-1">' + escapeHtml(pet.category) + (pet.breed ? ' &middot; ' + escapeHtml(pet.breed) : '') + '</p>' +
                  '<p class="card-text">' + escapeHtml(pet.description || 'No description.') + '</p>' +
                  '<button class="btn btn-outline-secondary btn-sm" onclick="editPet(' + index + ')">Edit</button> ' +
                  '<button class="btn btn-outline-danger btn-sm" onclick="deletePet(' + pet.pet_id + ')">Delete</button>' +
                '</div>' +
              '</div>' +
            '</div>';
        }).join('');
    } catch (err) {
        showAlert(document.getElementById('alertBox'), err.message);
    }
}

function editPet(index) {
    openForm(myPetsCache[index]);
}

async function deletePet(id) {
    if (!confirm('Delete this pet listing? This cannot be undone.')) return;
    try {
        await apiPostForm('/api/pet-delete', { pet_id: id });
        loadMyPets();
    } catch (err) {
        showAlert(document.getElementById('alertBox'), err.message);
    }
}
</script>
</body>
</html>
